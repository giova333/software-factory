# Reusable workflow: target repos call this (see examples/factory.yml).
name: factory

on:
  workflow_call:
    inputs:
      image:
        description: Factory image to run
        type: string
        default: ghcr.io/giova333/software-factory:main
      allowed_users:
        description: >-
          Comma-separated hard allowlist of GitHub logins. Overrides allowed_users in .factory.yml.
          Prefer the FACTORY_ALLOWED_USERS Actions variable (repo or org), which a PR cannot edit;
          it is used when this input is empty.
        type: string
        default: ''
    secrets:
      anthropic_api_key:
        required: true
      app_id:
        required: true
      app_private_key:
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Above .factory.yml limits.timeout_minutes (default 30), so the factory hits its own deadline
    # first and can still post its failure reply.
    timeout-minutes: 60
    # One run at a time per issue/PR. GitHub keeps at most ONE pending run per group: a third event
    # arriving while one runs and one waits replaces the waiting one, which is then cancelled.
    # There is no queue; re-send a dropped trigger (comment again, or re-add the label).
    concurrency:
      group: factory-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Mint factory-bot token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - name: Resolve bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Run factory
        env:
          IMAGE: ${{ inputs.image }}
          FACTORY_GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
          FACTORY_ALLOWED_USERS: ${{ inputs.allowed_users || vars.FACTORY_ALLOWED_USERS }}
          FACTORY_GIT_NAME: ${{ steps.bot.outputs.name }}
          FACTORY_GIT_EMAIL: ${{ steps.bot.outputs.email }}
          FACTORY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # The token goes in on stdin, not as -e: the agent runs as the same uid as the factory
        # (PID 1), so anything in the factory's environment is readable from /proc/1/environ.
        run: |
          out="$RUNNER_TEMP/factory-out"
          mkdir -p "$out" && chmod 777 "$out"
          printf '%s' "$FACTORY_GITHUB_TOKEN" | docker run -i --rm \
            -e ANTHROPIC_API_KEY -e FACTORY_ALLOWED_USERS \
            -e FACTORY_GIT_NAME -e FACTORY_GIT_EMAIL -e FACTORY_RUN_URL \
            -v "$GITHUB_EVENT_PATH:/event.json:ro" \
            -v "$out:/out" \
            "$IMAGE" run --token-stdin \
              --event /event.json --event-name "$GITHUB_EVENT_NAME" \
              --server-url "$GITHUB_SERVER_URL" --api-url "$GITHUB_API_URL" \
              --out /out

      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-run
          path: ${{ runner.temp }}/factory-out
          if-no-files-found: ignore
          retention-days: 14
