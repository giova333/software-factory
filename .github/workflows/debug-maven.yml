name: debug-maven
on:
  push:
    branches: [debug/maven-hang]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Maven through the factory's own sh(), node as PID 1, stdin piped
        run: |
          echo token | docker run -i --rm --entrypoint node ghcr.io/giova333/software-factory:main --input-type=module -e '
            import { execSync } from "node:child_process";
            import { sh, sandboxEnv } from "/app/dist/exec.js";
            const t0 = Date.now();
            execSync("git clone -q --depth 1 https://github.com/giova333/daily-experiments /tmp/de");
            const env = (sandboxEnv ?? (() => ({ PATH: process.env.PATH, HOME: process.env.HOME, CI: "true" })))();
            console.log("env", Object.keys(env));
            const r = await sh("mvn -B dependency:go-offline", { cwd: "/tmp/de", env, timeoutMs: 300000 });
            console.log("code", r.code, "timedOut", r.timedOut, "secs", (Date.now()-t0)/1000);
            console.log(r.stdout.slice(-3000)); console.log("STDERR", r.stderr.slice(-2000));
          '
